name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Assert the frozen corpus has 14 docs
        run: |
          count="$(ls data/docs/*.md | wc -l)"
          echo "docs: $count"
          test "$count" -eq 14

      - name: Run test suite
        run: |
          export PYTHONPATH=src
          python -m pytest -q

      - name: CLI help smoke test
        run: |
          export PYTHONPATH=src
          python -m rayu_rag --help > /dev/null
